<div class="category-menu">
  @if (selectedId) {
  <p>Selected: category #{{ selectedId }}</p>
  }
  <div class="categories-grid">
    @for (category of categories; track category) {
    <app-category-menu-item
      [category]="category"
      (selected)="onCategorySelected(category)">
    </app-category-menu-item>
    }
  </div>
</div>
